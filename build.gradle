plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
}

group = 'com.voidwatcher'
version = '0.4.0'

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings "net.fabricmc:yarn:1.21.1+build.3:v2"

    modImplementation "net.fabricmc:fabric-loader:0.16.10"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.115.0+1.21.1"
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:4.7.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Generate an unnerving 64x64 texture from deterministic pixel art.
tasks.register("generateWatcherTexture") {
    doLast {
        def out = file("src/main/resources/assets/voidwatcher/textures/entity/watcher.png")
        out.parentFile.mkdirs()

        def image = new java.awt.image.BufferedImage(
                64,
                64,
                java.awt.image.BufferedImage.TYPE_INT_ARGB
        )
        def g = image.createGraphics()
        g.setComposite(java.awt.AlphaComposite.Src)
        g.setColor(new java.awt.Color(0, 0, 0, 0))
        g.fillRect(0, 0, 64, 64)

        def rng = new java.util.Random(90210L)

        // Diseased grey-black base.
        g.setColor(new java.awt.Color(10, 10, 12, 255))
        g.fillRect(0, 0, 64, 64)

        // Cold flesh patches and random cracks.
        for (int i = 0; i < 900; i++) {
            int x = rng.nextInt(64)
            int y = rng.nextInt(64)
            int v = 22 + rng.nextInt(48)
            int b = Math.min(90, v + 8)
            g.setColor(new java.awt.Color(v, v, b, 255))
            g.fillRect(x, y, 1 + rng.nextInt(2), 1 + rng.nextInt(2))
        }

        // Face.
        g.setColor(new java.awt.Color(58, 58, 62, 255))
        g.fillRect(1, 1, 14, 14)
        g.setColor(new java.awt.Color(5, 5, 7, 255))
        g.fillRect(2, 3, 12, 9)

        // One dead-white eye with a red center.
        g.setColor(new java.awt.Color(235, 235, 225, 255))
        g.fillRect(4, 5, 9, 4)
        g.setColor(new java.awt.Color(155, 10, 15, 255))
        g.fillRect(7, 4, 3, 7)
        g.setColor(new java.awt.Color(5, 5, 5, 255))
        g.fillRect(8, 5, 1, 5)

        // Open mouth / teeth.
        g.setColor(new java.awt.Color(3, 3, 4, 255))
        g.fillRect(3, 10, 11, 5)
        g.setColor(new java.awt.Color(210, 210, 198, 255))
        for (int x : [4, 6, 8, 10, 12]) {
            g.fillRect(x, 10, 1, 2)
        }

        // Ribs.
        g.setColor(new java.awt.Color(82, 82, 88, 255))
        for (int y : [21, 24, 27, 30, 33]) {
            g.fillRect(17, y, 14, 1)
        }
        g.setColor(new java.awt.Color(15, 15, 17, 255))
        g.fillRect(16, 16, 17, 20)

        // Long limbs.
        g.setColor(new java.awt.Color(28, 28, 32, 255))
        g.fillRect(0, 32, 18, 18)
        g.fillRect(18, 32, 28, 18)
        g.fillRect(46, 32, 14, 18)

        // Fingers / claws.
        g.setColor(new java.awt.Color(116, 116, 120, 255))
        for (int x : [50, 53, 56]) {
            g.fillRect(x, 50, 2, 11)
        }
        for (int x : [36, 39, 42]) {
            g.fillRect(x, 50, 2, 10)
        }

        // Random red-black stains.
        for (int i = 0; i < 70; i++) {
            int x = rng.nextInt(64)
            int y = rng.nextInt(64)
            int a = 70 + rng.nextInt(150)
            g.setColor(new java.awt.Color(70 + rng.nextInt(80), 5, 8, a))
            g.fillRect(x, y, 1 + rng.nextInt(3), 1 + rng.nextInt(4))
        }

        g.dispose()
        javax.imageio.ImageIO.write(image, "png", out)
    }
}

tasks.named("processResources") {
    dependsOn(tasks.named("generateWatcherTexture"))
}
